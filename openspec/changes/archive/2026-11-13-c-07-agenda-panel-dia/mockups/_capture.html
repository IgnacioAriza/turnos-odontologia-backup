<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captura — mockup C-07</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Mockup" src="agenda.html" width="390" height="844"></iframe>
    <script>
      var params = new URLSearchParams(window.location.search);
      var mock = params.get("mock") || "agenda";
      var width = params.get("w") || "390";
      var frame = document.getElementById("frame");
      frame.style.width = width + "px";
      /* cache-buster: cada revisión debe renderizar el HTML y CSS actuales */
      frame.src = mock + ".html?v=" + Date.now();

      function fit() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.documentElement) return;
          frame.style.height = doc.documentElement.scrollHeight + "px";
        } catch (error) {
          /* servido por HTTP */
        }
      }

      frame.addEventListener("load", function () {
        fit();
        window.setTimeout(fit, 400);
      });
    </script>
  </body>
</html>
